<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>India Stock Market - Year-wise Pages</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Modern CSS -->
    <style>
        :root {
            --bg-color: #0f172a;
            --card-color: #111827;
            --accent: #22c55e;
            --accent-soft: rgba(34, 197, 94, 0.15);
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #1f2937, #020617);
            color: var(--text-main);
            padding: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
            border: 1px solid #1f2937;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 span.badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--accent-soft);
            color: var(--accent);
        }

        p.subtitle {
            margin: 0 0 20px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .last-updated {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            padding: 8px 12px;
            background: rgba(31, 41, 55, 0.5);
            border-radius: 8px;
        }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            background: #020617;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            min-width: 80px;
            padding: 12px 16px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background: #111827;
            color: var(--text-main);
        }

        .tab-btn.active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            margin: 24px 0 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #e5e7eb;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 480px;
        }

        thead {
            background: linear-gradient(to right, #15803d, #16a34a);
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            font-size: 0.9rem;
        }

        th { color: #f9fafb; font-weight: 600; }

        tbody tr {
            background-color: #020617;
            transition: all 0.15s ease;
        }

        tbody tr:nth-child(even) { background-color: #020617; }
        tbody tr:hover { background-color: #111827; }
        tbody tr.selected { background-color: var(--accent-soft); transform: translateY(-1px); }

        td.positive { color: #4ade80; font-weight: 600; }
        td.negative { color: #f97373; font-weight: 600; }

        /* Year-specific styling */
        .year-header {
            background: linear-gradient(135deg, #15803d, #16a34a);
            color: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .month-table {
            font-size: 0.85rem;
            min-width: 400px;
        }

        .month-table th, .month-table td { padding: 8px 10px; }

        .note {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
            padding: 16px;
            background: rgba(31, 41, 55, 0.5);
            border-radius: 10px;
            border-left: 4px solid var(--accent-soft);
        }

        @media (max-width: 768px) {
            body { padding: 16px; }
            .tab-btn { min-width: 70px; padding: 10px 12px; font-size: 0.85rem; }
            table { min-width: 380px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>
            India Stock Market
            <span class="badge">Year-wise Analysis</span>
        </h1>

        <p class="subtitle">
            Click any year tab below to see annual summary + monthly Nifty 50 returns breakdown. Data is approximate for educational use. [web:43][web:44]
        </p>

        <div class="last-updated" id="lastUpdated"></div>

        <!-- Tab Navigation -->
        <div class="tab-nav">
            <button class="tab-btn active" data-tab="2024">2024</button>
            <button class="tab-btn" data-tab="2023">2023</button>
            <button class="tab-btn" data-tab="2022">2022</button>
            <button class="tab-btn" data-tab="2021">2021</button>
            <button class="tab-btn" data-tab="2020">2020</button>
            <button class="tab-btn" data-tab="2019">2019</button>
            <button class="tab-btn" data-tab="2018">2018</button>
            <button class="tab-btn" data-tab="2017">2017</button>
            <button class="tab-btn" data-tab="2016">2016</button>
            <button class="tab-btn" data-tab="2015">2015</button>
        </div>

        <!-- Tab Contents -->
        <div id="tabContents">
            <!-- Dynamic content injected by JS -->
        </div>
    </div>
</div>

<script>
    // Set last updated
    document.getElementById("lastUpdated").textContent = 
        `Last updated: ${new Date().toLocaleString("en-IN", {
            day: "2-digit", month: "short", year: "numeric",
            hour: "2-digit", minute: "2-digit"
        })} (IST)`;

    // Data structure: year → { annualNifty, annualSensex, monthlyReturns }
    const marketData = {
        2024: { nifty: 9.4, sensex: 9.5, monthly: [0.8,1.2,-0.4,2.1,-1.0,0.5,1.3,-0.7,0.9,1.1,-0.6,0.7] },
        2023: { nifty: 19.8, sensex: 18.5, monthly: [2.0,-1.1,1.4,3.2,0.9,1.8,2.5,-0.5,1.9,2.3,1.0,1.4] },
        2022: { nifty: 4.3, sensex: 4.5, monthly: [0.6,-0.8,1.1,-1.5,0.3,-0.4,0.7,1.0,-0.9,1.4,0.5,1.3] },
        2021: { nifty: 24.6, sensex: 23.0, monthly: [1.8,2.2,0.9,2.6,1.3,1.7,2.9,1.5,1.6,2.0,2.3,3.0] },
        2020: { nifty: 16.1, sensex: 15.8, monthly: [0.5,-6.0,-23.0,14.0,7.5,8.0,7.2,3.1,-1.4,4.0,6.2,6.0] },
        2019: { nifty: 13.5, sensex: 17.3, monthly: [0.6,-0.4,7.7,1.1,-1.2,0.2,-5.7,-0.9,4.1,3.8,-1.5,6.4] },
        2018: { nifty: 4.6, sensex: 11.3, monthly: [5.6,-0.3,-3.6,6.2,-0.2,-0.6,5.6,2.8,-6.4,-4.9,4.7,-0.1] },
        2017: { nifty: 30.3, sensex: 16.9, monthly: [4.5,3.4,2.6,1.4,2.5,1.7,5.8,-1.6,0.7,2.7,1.8,3.5] },
        2016: { nifty: 4.4, sensex: -9.4, monthly: [-4.9,-7.3,10.8,1.4,3.0,1.6,4.9,1.9,-2.1,-0.1,-4.6,3.5] },
        2015: { nifty: -3.0, sensex: 24.9, monthly: [6.1,2.8,-4.6,-0.4,3.0,-1.4,1.2,-6.4,-0.4,1.7,-1.4,0.1] }
    };

    const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    // Tab switching logic
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const year = btn.dataset.tab;
            
            // Update active tab
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Show selected tab content
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab-${year}`).classList.add('active');
        });
    });

    // Generate tab content for each year
    const tabContents = document.getElementById('tabContents');
    Object.keys(marketData).sort((a,b) => b - a).forEach(year => {
        const data = marketData[year];
        const tabContent = document.createElement('div');
        tabContent.className = 'tab-content';
        tabContent.id = `tab-${year}`;
        if (year === '2024') tabContent.classList.add('active');

        tabContent.innerHTML = `
            <div class="year-header">
                📈 ${year} – Nifty: <span class="${data.nifty >= 0 ? 'positive' : 'negative'}">${data.nifty.toFixed(1)}%</span> | 
                Sensex: <span class="${data.sensex >= 0 ? 'positive' : 'negative'}">${data.sensex.toFixed(1)}%</span>
            </div>

            <div class="section-title">Monthly Breakdown (Nifty 50)</div>
            <div class="table-wrapper">
                <table class="month-table">
                    <thead>
                        <tr><th>Month</th><th>Return (%)</th></tr>
                    </thead>
                    <tbody>
                        ${data.monthly.map((ret, i) => {
                            const cls = ret >= 0 ? 'positive' : 'negative';
                            return `<tr><td>${monthNames[i]}</td><td class="${cls}">${ret.toFixed(1)}%</td></tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>

            <div class="note">
                <strong>${year} Note:</strong> Annual returns are calendar year-end values. Monthly data shows approximate Nifty 50 performance. 
                Source: Public index data (NSE/BSE historical records). [web:43][web:44]
            </div>
        `;
        tabContents.appendChild(tabContent);
    });
</script>
</body>
</html>
